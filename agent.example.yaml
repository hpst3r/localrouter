# LocalRouter AGENT example. Copy to ~/.config/localrouter/agent.yaml on each
# host that runs Claude Code (laptop, Mac, worker VMs). Run: localrouter agent
server: https://router.example.com:8787   # central router; client must trust its certificate
# HTTP is possible, but should only ever be considered over an encrypted network overlay.
host: laptop                          # this machine's name in reports
key_file: ~/.config/localrouter/agent.key   # a server client key with ingest: true
account: claude-max                   # claude account id on the server

# claude_projects_dir: ~/.claude/projects
credentials:
  source: auto                        # auto: macOS Keychain then file; Linux: file
  # file: ~/.claude/.credentials.json
  # keychain_service: "Claude Code-credentials"

# push_interval: 1m
# quota_interval: 5m                  # 0s disables quota push from this host
