# LocalRouter edge — TLS termination + SSE-safe reverse proxy.
#
# Install: copy to ~/.local/share/localrouter/nginx/localrouter.conf
#          (mounted read-only at /etc/nginx/conf.d/default.conf).
# Operator provisions tls.crt / tls.key in ~/.local/share/localrouter/tls,
# mounted read-only at /etc/nginx/tls.
#
# Backend: the LocalRouter container is reached by its network alias
# `localrouter` on the dedicated bridge. Host is preserved explicitly so
# LocalRouter's always-on host guard sees the real name and can match
# `allowed_hosts`.

upstream localrouter_upstream {
    server localrouter:8787;

    # HTTP keepalive to the upstream (pairs with proxy_http_version 1.1 and an
    # empty Connection header below).
    keepalive 32;
}

# Loopback-only plain-HTTP health listener. The unprivileged image ships no curl
# and no openssl, and its busybox wget cannot skip TLS verification, so the
# container health probe uses this local HTTP endpoint (bound to 127.0.0.1
# inside the container netns only; never published, unreachable from the
# bridge or the host).
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /readyz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 404; }
}

server {
    # NGINX-unprivileged listens unprivileged (>=1024); 8443 is published.
    listen 8443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Router body limit is 32 MiB; NGINX default is 1m and would 413 first.
    client_max_body_size 32m;

    proxy_http_version 1.1;

    # Preserve the client Host verbatim so LocalRouter's host guard matches
    # `allowed_hosts`. NGINX's default here is $proxy_host, so set it explicitly.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization is passed through UNCHANGED: no header is set or cleared here.
    # Empty Connection enables upstream keepalive (required for `keepalive`).
    proxy_set_header Connection "";

    # ---- SSE correctness ----
    proxy_buffering          off;      # flush tokens as they arrive
    proxy_request_buffering  off;      # stream request bodies immediately
    proxy_read_timeout       3600s;    # default 60s would cut quiet-but-live SSE
    proxy_send_timeout       3600s;
    proxy_cache              off;
    proxy_socket_keepalive   on;

    # Public /readyz is proxied by location / below: it reflects router storage
    # and shutdown readiness. The separate loopback 8081 probe is edge liveness.
    location = /readyz {
        access_log off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass http://localrouter_upstream;
    }

    location / {
        proxy_pass http://localrouter_upstream;
    }
}
