# LocalRouter example configuration. Copy to ~/.config/localrouter/config.yaml.
# Secrets live in separate 0600 files, never in this file.

listen: 127.0.0.1:8787
data_dir: ~/.config/localrouter

quota:
  poll_interval: 5m

policy:
  stale_after: 10m        # older snapshots: deny background on reserved accounts
  safety_margin: 0.02     # extra headroom background must leave above the reserve
  inflight_estimate: 0.01 # assumed fraction consumed per in-flight request
  max_failovers: 2

# Concurrency limits and inbound timeouts are optional; the values below are
# the defaults. Both reject negative values at load; 0 means unlimited / use
# the default.
limits:
  max_concurrent: 0              # global cap on active inference requests; 0 = unlimited
  # max_concurrent_per_client:   # per-client caps keyed by registered client name
  #   me: 4                      # 0 = unlimited for that client

timeouts:
  header: 10s                    # request header/request-line read deadline
  body: 30s                      # request body read deadline (lifted once the body is read)
  idle: 120s                     # keep-alive idle timeout between requests
  shutdown: 30s                  # graceful drain budget on shutdown

clients:
  - name: me
    class: interactive
    key_file: keys/me.key
    # For zero-downtime key rotation, list several single-key files instead
    # (both authenticate as this client); key_file and key_files are mutually
    # exclusive and each file holds exactly one raw key:
    #   key_files: [keys/me-old.key, keys/me-new.key]
  - name: hermes
    class: interactive        # Hermes may send X-LocalRouter-Class: background
    key_file: keys/hermes.key
  - name: hermes-bg
    class: background
    key_file: keys/hermes-bg.key

accounts:
  - id: codex-primary
    provider: codex
    reserve: { 5h: 0.10, weekly: 0.10 }
  - id: codex-secondary
    provider: codex
    reserve: {}               # drain fully
  - id: claude-max
    provider: claude          # quota-only; reads ~/.claude/.credentials.json, never proxies
    reserve: { 5h: 0.10, weekly: 0.10 }
  - id: ollama-cloud
    provider: ollama
    api_key_file: keys/ollama.key
    reserve: { 5h: 0.10, weekly: 0.10 }
  # Typed decisions (Jev) go through OpenRouter (prepaid; no reserve).
  # - id: openrouter-main
  #   provider: openrouter
  #   api_key_file: keys/openrouter.key   # base_url defaults to https://openrouter.ai/api/v1

routes:
  - name: gpt
    models: [gpt-5.6-sol, gpt-5.6-luna]
    interactive: [codex-primary, codex-secondary]
    background:  [codex-secondary, codex-primary]
  - name: ollama
    models: [deepseek-v4.1-flash, kimi-k3]
    interactive: [ollama-cloud]
    background:  [ollama-cloud]
  # Typed decisions are opt-in; without a route like these, /v1/systemone and
  # /v1/decisions answer 404. A decision route is single-family, OpenRouter
  # only, text-only, and every candidate shares one pinned upstream_model
  # (moving aliases such as ~typesafe/jev-latest need allow_alias: true on
  # every candidate). See docs/SPEC.md "Typed decisions".
  #
  # System One shape (TypeSafe SDK with base URL http://127.0.0.1:8787):
  # POST /v1/systemone -> https://openrouter.ai/api/v1/systemone
  # - name: jev-systemone
  #   models: [jev-1.13]
  #   interactive: [openrouter-main]
  #   upstreams:
  #     openrouter-main:
  #       upstream_model: typesafe/jev-1.13
  #       protocols: [systemone]
  #       input_modalities: [text]
  #       question_types: [noul, choice, score]
  #
  # OpenRouter Decisions API shape (any OpenRouter decision model):
  # POST /v1/decisions -> https://openrouter.ai/api/alpha/decisions
  # - name: jev-decisions
  #   models: [jev]
  #   interactive: [openrouter-main]
  #   upstreams:
  #     openrouter-main:
  #       upstream_model: typesafe/jev-1.14
  #       protocols: [decisions]
  #       input_modalities: [text]
  #       question_types: [noul, choice, score]

# decisions:                  # optional bounds for decision routes (defaults shown)
#   max_questions: 64
#   max_question_name_bytes: 128
#   max_choice_options: 255
#   max_score_levels: 10
#   max_nesting: 64

claude_logs:                  # ingest Claude Code token usage from local transcripts
  enabled: true
  account: claude-max
  # dir: ~/.claude/projects
  # scan_interval: 1m
