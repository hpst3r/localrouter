# LocalRouter example configuration. Copy to ~/.config/localrouter/config.yaml.
# Secrets live in separate 0600 files, never in this file.

listen: 127.0.0.1:8787
data_dir: ~/.config/localrouter

quota:
  poll_interval: 5m

policy:
  stale_after: 10m        # older snapshots: deny background on reserved accounts
  safety_margin: 0.02     # extra headroom background must leave above the reserve
  inflight_estimate: 0.01 # assumed fraction consumed per in-flight request
  max_failovers: 2
  # Optional reachability breaker (off unless threshold > 0): after `threshold`
  # consecutive attempts that got no upstream response (DNS, connect, TLS,
  # reset, header timeout) an account is skipped for `base`, then one probe is
  # let through; each failed probe doubles the wait up to `max`. Requests
  # whose only candidates are skipped get 503 upstream_unavailable.
  # breaker:
  #   threshold: 3
  #   base: 5s
  #   max: 60s

# Concurrency limits and inbound timeouts are optional; the values below are
# the defaults. Both reject negative values at load; 0 means unlimited / use
# the default.
limits:
  max_concurrent: 0              # global cap on active inference requests; 0 = unlimited
  # max_concurrent_per_client:   # per-client caps keyed by registered client name
  #   me: 4                      # 0 = unlimited for that client

timeouts:
  header: 10s                    # request header/request-line read deadline
  body: 30s                      # request body read deadline (lifted once the body is read)
  idle: 120s                     # keep-alive idle timeout between requests
  shutdown: 30s                  # graceful drain budget on shutdown

clients:
  - name: me
    class: interactive
    key_file: keys/me.key
    # For zero-downtime key rotation, list several single-key files instead
    # (both authenticate as this client); key_file and key_files are mutually
    # exclusive and each file holds exactly one raw key:
    #   key_files: [keys/me-old.key, keys/me-new.key]
  - name: hermes
    class: interactive        # Hermes may send X-LocalRouter-Class: background
    key_file: keys/hermes.key
  - name: hermes-bg
    class: background
    key_file: keys/hermes-bg.key

accounts:
  - id: codex-primary
    provider: codex
    reserve: { 5h: 0.10, weekly: 0.10 }
  - id: codex-secondary
    provider: codex
    reserve: {}               # drain fully
  - id: claude-max
    provider: claude          # quota-only; reads ~/.claude/.credentials.json, never proxies
    reserve: { 5h: 0.10, weekly: 0.10 }
  - id: ollama-cloud
    provider: ollama
    api_key_file: keys/ollama.key
    reserve: { 5h: 0.10, weekly: 0.10 }

routes:
  - name: gpt
    models: [gpt-5.6-sol, gpt-5.6-luna]
    interactive: [codex-primary, codex-secondary]
    background:  [codex-secondary, codex-primary]
  - name: ollama
    models: [deepseek-v4.1-flash, kimi-k3]
    interactive: [ollama-cloud]
    background:  [ollama-cloud]
  # Model discovery (optional): serve whatever ids the candidates' GET
  # {base_url}/models lists, instead of listing models by hand. Candidates must
  # be openai_compat or ollama accounts, and upstream_model must stay empty.
  # discover_match globs use Go path.Match, so "*" does not cross "/": write
  # "unsloth/*" or "*/*", not "*". An id two discovering routes would both
  # serve is refused (404) until discover_match or a static entry settles it.
  # - name: llama-lab
  #   discover_models: true
  #   discover_interval: 5m          # default 5m; within [30s, 24h]
  #   discover_match: ["unsloth/*"]  # optional path.Match globs; absent = all ids
  #   interactive: [llama-lab]
  #   background:  [llama-lab]

# Backend model check (optional, restart-only): every interval, compare each
# static route's backend model id with its openai_compat/ollama candidates'
# GET {base_url}/models listings and report drift in diagnostics and the log
# (it never changes routing). Absent or 0 = disabled. One-shot equivalent:
# `localrouter check -probe`.
# model_check:
#   interval: 5m                 # within [30s, 24h]

  # Pooled self-hosted replicas (routes[].balance): spread one alias over
  # equal llama-server boxes by weighted least in-flight instead of "first
  # admissible wins". Members must equal interactive ∪ background, share one
  # openai_compat/ollama provider and cost_basis, and (with upstreams) declare
  # identical capabilities. Absent block = the ordered route above.
  # - name: qwen-local
  #   models: [qwen3.5:9b]
  #   upstream_model: unsloth/Qwen3.5-9B-GGUF:Q4_K_M
  #   interactive: [lab-6800xt, lab-p100]   # order = tie-break preference
  #   background:  [lab-p100, lab-6800xt]
  #   balance:
  #     strategy: least_inflight            # required; only value
  #     identity: "Qwen3.5-9B Q4_K_M"       # required declaration of model+quant
  #     sticky_ttl: 15m                     # optional X-LocalRouter-Session affinity; 0/absent = off
  #     members:
  #       lab-6800xt: {weight: 2, max_inflight: 4}   # max_inflight = llama-server -np; 0 = uncapped; per ACCOUNT, enforced on every route
  #       lab-p100:   {weight: 1, max_inflight: 2}

claude_logs:                  # ingest Claude Code token usage from local transcripts
  enabled: true
  account: claude-max
  # dir: ~/.claude/projects
  # scan_interval: 1m
