name: Release

# Only v* tags trigger a release. Nothing here tags, pushes, or publishes on
# pull requests or branch pushes.
"on":
  push:
    tags:
      - "v*"

# Least privilege by default; the two publishing jobs opt in below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate 1: the ref must be a publishable release tag. This job only classifies
  # the tag and is the ONLY producer of the version output everything else uses.
  validate-tag:
    name: validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Validate v<semver> tag format -> version
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STRICT tag policy: only v<major>.<minor>.<patch> optionally followed
          # by a SINGLE -<prerelease> part. This is a deliberate choice, enforced
          # and documented:
          #   * SemVer build metadata ("+<...>") is REJECTED. `+` is not a valid
          #     character in an OCI tag grammar ([A-Za-z0-9_.-]{1,128}), so a tag
          #     carrying metadata cannot be published to GHCR. Rather than invent
          #     a lossy conversion (e.g. `+`->`-`) that would make the release tag
          #     disagree with a GHCR tag of the same name, a metadata-bearing tag
          #     fails the release loudly. Cut the release from the bare
          #     vX.Y.Z[-prerelease] ref instead.
          #   * Pre-release identifiers MAY contain dots (v1.2.3-rc.1). Dots are
          #     legal in OCI tags, so the tag, the GHCR tag, and the version output
          #     stay byte-identical.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "refusing release: tag '$TAG' is not a strict v<major>.<minor>.<patch>[-prerelease] tag" >&2
            echo "  (build metadata after '+' is not a valid OCI image tag and is rejected)" >&2
            exit 1
          fi
          version="${TAG#v}"
          # Defence in depth: never emit a version that would be an invalid OCI
          # tag; publish-image derives its tag from this exact value.
          if [[ ${#version} -gt 128 ]] || [[ ! "$version" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "refusing release: derived version '$version' is not a valid OCI tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Gate 2 (fail-closed): find the image definition in the tree. The build
  # FAILS if the root Containerfile is missing -- there is no silent skip and no
  # invented optional build.
  detect-containerfile:
    name: detect Containerfile
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      path: ${{ steps.find.outputs.path }}
    steps:
      - name: Check out the tag (immutable ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Require the root Containerfile
        id: find
        run: |
          set -euo pipefail
          candidate="Containerfile"
          if [ -f "$candidate" ]; then
            echo "path=$candidate" >> "$GITHUB_OUTPUT"
            echo "found $candidate"
            exit 0
          fi
          echo "no Containerfile at the repository root; the image cannot be built from this tree" >&2
          exit 1

  # Packaging: gate vet + race tests BEFORE cross-compiling/releasing archives.
  # No other job depends on it, so an unverified native build can no longer
  # block, gate, or delay the image publish below.
  build-native:
    name: build native archives
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOFLAGS: -p=2
      GOMAXPROCS: "2"
      # Finite bounds: no step may wedge a release run indefinitely.
      GOTEST_TIMEOUT: 120s
    steps:
      - name: Check out the tag (immutable ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # No Actions cache in the release build: GOMODCACHE/GOCACHE entries saved
      # by branch CI runs are not re-verified against go.sum, so a poisoned
      # cache would flow into the published archives. Modules are fetched
      # fresh and checked with `go mod verify`.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify module checksums
        timeout-minutes: 10
        run: |
          set -euo pipefail
          go mod download
          go mod verify

      - name: Gate - vet and race tests before packaging
        timeout-minutes: 20
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go vet ./...
          go test -race -p 2 -count=1 -timeout "$GOTEST_TIMEOUT" ./...

      - name: Build four native archives and SHA256SUMS
        timeout-minutes: 15
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/release.sh "${GITHUB_WORKSPACE}/dist" "$VERSION"

      - name: Upload archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-archives
          path: dist/*
          if-no-files-found: error

  # Image publication is blocked until the native vet/race gate passes.
  publish-image:
    name: publish multi-arch image
    needs:
      - validate-tag
      - detect-containerfile
      - build-native
    runs-on: ubuntu-latest
    # Publishing jobs run in the `release` environment so the repository owner
    # can require reviewer approval and restrict it to protected v* tags
    # (repository settings; see docs/CONTAINERS.md).
    environment: release
    permissions:
      contents: read
      packages: write
      # Sigstore-signed build provenance for the pushed image digest.
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out the tag (immutable ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # The binfmt helper runs privileged; pin it by index digest
      # (tonistiigi/binfmt:qemu-v10.2.3) and skip the Actions image cache.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false

      # Bounded parallelism: a single buildx builder whose NodeGroup caps every
      # build at 2 concurrent buildkit workers. Configured inline (this workflow
      # may only be the sole change) and passed to build-push-action via `builder`,
      # so the limit applies no matter how buildx was set up. The buildkit
      # image is pinned by index digest (moby/buildkit:v0.34.0).
      - name: Set up Buildx (max 2 parallel buildkit workers)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: localrouter-release
          driver-opts: image=docker.io/moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 + linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ needs.detect-containerfile.outputs.path }}
          builder: localrouter-release
          platforms: linux/amd64,linux/arm64
          # The Containerfile's `go build ... && /out/localrouter --help` runs
          # under QEMU for arm64; --help is a clean, exit-0 smoke test there.
          push: true
          build-args: |
            VERSION=${{ needs.validate-tag.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.validate-tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=localrouter

      # Provenance is bound to the multi-arch index digest and pushed to GHCR
      # next to the image. Verify with:
      #   gh attestation verify oci://ghcr.io/hpst3r/localrouter@sha256:<digest> --repo hpst3r/localrouter
      # Storage records are an org-only API, so they are not created.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record image digest
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Image: ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin by digest: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  # Publish the GitHub release LAST: it consumes the native archives (hence the
  # build-native dependency) and runs concurrently with the image publish. No
  # repository code runs here: download, verify, attest, upload.
  publish-release:
    name: publish GitHub release
    needs:
      - validate-tag
      - build-native
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Sigstore-signed build provenance for the archives and SHA256SUMS.
      id-token: write
      attestations: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-archives
          path: dist

      - name: Verify checksums before publishing
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      # Verify with: gh attestation verify <archive> --repo hpst3r/localrouter
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      # The runner's preinstalled gh CLI replaces a third-party release action.
      # A new release is named after the tag, has an empty body and is neither
      # a draft nor a prerelease. If a release for the tag already exists, its
      # metadata is left alone and same-named assets are replaced.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(dist/*.tar.gz dist/SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "" "${files[@]}"
          fi
